# Set true color. terminal-features is the modern form of the old
# terminal-overrides ",xterm*:Tc". Undercurl and coloured underlines for LSP
# diagnostics need no override: tmux-256color already supplies Smulx/Setulc.
set-option -sa terminal-features ",xterm*:RGB"

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# set prefix to crtl space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes (-r so they can be repeated without re-pressing the prefix)
bind -r j resize-pane -D 10
bind -r k resize-pane -U 10
bind -r h resize-pane -L 10
bind -r l resize-pane -R 10

set -sg escape-time 10

# enable vim key modes on tmux.
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# mouse.
set -g mouse on

# focus events (needed for Neovim's autoread and gitsigns refresh)
set-option -g focus-events on

# plenty of scrollback for build and test output
set -g history-limit 50000

# let programs talk to the outer terminal directly (image previews etc.)
set -g allow-passthrough on

# number windows and panes from 1, and keep the numbering gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# color scheme
set -g @tokyo-night-tmux_theme storm

set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_show_git 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "janoamaral/tokyo-night-tmux"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
